<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Mermaid external link confirmation demo</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=" />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 2rem;
      }

      textarea {
        box-sizing: border-box;
        width: min(100%, 40rem);
        min-height: 12rem;
        font-family: 'Courier New', Courier, monospace;
      }

      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
      }

      #status {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-left: 4px solid #2563eb;
        background: #eff6ff;
      }

      #status[data-state='allowed'] {
        border-left-color: #15803d;
        background: #f0fdf4;
      }

      #status[data-state='blocked'] {
        border-left-color: #b91c1c;
        background: #fef2f2;
      }

      #diagram {
        margin-top: 1.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        padding: 1rem;
        min-height: 16rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>External link confirmation demo</h1>
    <p>
      This page shows <code>filterExternalRequests.links</code> using a browser confirmation popup
      before Mermaid opens a built-in diagram link.
    </p>

    <label for="code">Diagram source</label><br />
    <textarea id="code" spellcheck="false"></textarea><br />
    <button id="render" type="button">Render diagram</button>

    <div id="status" data-state="idle">
      Render the diagram, then click the <strong>Open docs</strong> node and respond to the browser
      confirmation popup.
    </div>
    <div id="diagram"></div>

    <script type="module">
      import mermaid from './mermaid.esm.mjs';

      const defaultCode = `flowchart LR
    intro[Render the diagram]
    docs[Open docs]

    intro --> docs
    click docs "https://mermaid.js.org/config/usage.html" _blank`;

      const codeElement = document.getElementById('code');
      const diagramElement = document.getElementById('diagram');
      const statusElement = document.getElementById('status');
      let renderId = 0;

      const setStatus = (message, state = 'idle') => {
        statusElement.dataset.state = state;
        statusElement.textContent = message;
      };

      codeElement.value = defaultCode;

      mermaid.initialize({
        startOnLoad: false,
        logLevel: 0,
        securityLevel: 'loose',
        filterExternalRequests: {
          links: async (url) => {
            const allowed = window.confirm(
              `Allow Mermaid to open this link?\n\n${url}\n\nPress OK to allow or Cancel to block.`
            );

            if (allowed) {
              setStatus(`Allowed link: ${url}`, 'allowed');
              return url;
            }

            setStatus(`Blocked link: ${url}`, 'blocked');
            return null;
          },
        },
      });

      const renderDiagram = async () => {
        setStatus('Rendering diagram. Click the "Open docs" node to test link filtering.', 'idle');
        const currentRenderId = `filter-external-links-demo-${renderId++}`;

        try {
          const { svg, bindFunctions } = await mermaid.render(currentRenderId, codeElement.value);
          diagramElement.innerHTML = svg;
          bindFunctions?.(diagramElement);
        } catch (error) {
          setStatus(
            `Rendering failed: ${error instanceof Error ? error.message : String(error)}`,
            'blocked'
          );
          diagramElement.textContent = '';
        }
      };

      document.getElementById('render').addEventListener('click', () => {
        void renderDiagram();
      });
    </script>
  </body>
</html>
